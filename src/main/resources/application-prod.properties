# prod-profiili: PostgreSQL (Supabase). Käyttöön ympäristömuuttujalla SPRING_PROFILES_ACTIVE=prod.
#
# Yhteystiedot luetaan ympäristömuuttujista ${...}-syntaksilla. Salasanaa tai osoitetta EI kirjoiteta tähän,
# koska tämä tiedosto menee GitHubiin. Jos DB_URL puuttuu tai se on postgresql://-muodossa ilman jdbc:-alkua,
# sovellus ei käynnisty ja virheenä on: 'url' must start with "jdbc".
#
# DB_URL      esim. jdbc:postgresql://aws-0-eu-north-1.pooler.supabase.com:5432/postgres?sslmode=require
# DB_USERNAME esim. postgres.abcdefghijklmnop   (Session poolerissa käyttäjänimen perässä on projektin tunnus)
# DB_PASSWORD Supabase-projektin tietokantasalasana
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Supabasen ilmaisversiossa poolerin yhteyksiä on rajallisesti, joten pidetään oma yhteyspooli pienenä.
# HikariCP on Spring Bootin oletusyhteyspooli: se pitää muutaman yhteyden auki valmiina, ettei jokaista kyselyä varten avata uutta.
spring.datasource.hikari.maximum-pool-size=5

# H2-konsoli ei kuulu tuotantoon
spring.h2.console.enabled=false
spring.jpa.show-sql=false

# Tuotannossa ei luoda testitunnuksia (admin/admin olisi julkisessa sovelluksessa tietoturvariski).
# Demoa varten ne voi ottaa käyttöön ympäristömuuttujalla DEMO_DATA=true. Data luodaan vain, jos kanta on tyhjä.
golftracker.demo-data=${DEMO_DATA:false}
