<!-- MVC-rooli: View. Rekisteröitymislomake: luo käyttäjätunnuksen ja samalla oman pelaajaprofiilin. -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Rekisteröidy')}"></head>
<body class="auth">
    <main class="auth__wrap">
        <div class="auth__brand">
            <a th:replace="~{fragments :: logo}"></a>
            <p>Luo tunnukset ja aloita kierrosten seuranta.</p>
        </div>

        <div class="card auth__card">
            <h1>Luo tunnukset</h1>

            <!-- th:action lisää lomakkeeseen automaattisesti piilotetun CSRF-tokenin -->
            <form class="form" th:action="@{/rekisteroidy}" th:object="${lomake}" method="post">

                <div class="field">
                    <label for="username">Käyttäjänimi</label>
                    <input type="text" th:field="*{username}" th:errorclass="is-invalid" autocomplete="username">
                    <!-- th:errors näyttää kentän validointivirheet, th:if piilottaa rivin kun virheitä ei ole -->
                    <p class="field-error" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></p>
                </div>

                <div class="field">
                    <label for="nimi">Pelaajan nimi</label>
                    <input type="text" th:field="*{nimi}" th:errorclass="is-invalid" placeholder="Näkyy pelaajalistassa">
                    <p class="field-error" th:if="${#fields.hasErrors('nimi')}" th:errors="*{nimi}"></p>
                </div>

                <div class="field">
                    <label for="salasana">Salasana</label>
                    <input type="password" th:field="*{salasana}" th:errorclass="is-invalid" autocomplete="new-password">
                    <p class="field-error" th:if="${#fields.hasErrors('salasana')}" th:errors="*{salasana}"></p>
                </div>

                <div class="field">
                    <label for="salasanaUudelleen">Salasana uudelleen</label>
                    <input type="password" th:field="*{salasanaUudelleen}" th:errorclass="is-invalid" autocomplete="new-password">
                    <p class="field-error" th:if="${#fields.hasErrors('salasanaUudelleen')}" th:errors="*{salasanaUudelleen}"></p>
                </div>

                <button type="submit" class="btn btn--primary btn--block">Rekisteröidy</button>
            </form>

            <p class="auth__switch">Onko sinulla jo tunnukset? <a th:href="@{/login}">Kirjaudu sisään</a></p>
        </div>
    </main>
</body>
</html>
