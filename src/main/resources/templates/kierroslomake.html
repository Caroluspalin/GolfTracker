<!-- MVC-rooli: View. Sama lomake toimii sekä lisäykseen että muokkaukseen. -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Kierros')}"></head>
<body>
    <header th:replace="~{fragments :: navbar('kierros')}"></header>

    <main class="container container--narrow">
        <a class="back-link" th:href="@{/pelaajat}">← Takaisin pelaajiin</a>

        <div class="card form-card">
            <!-- Otsikko riippuu siitä, onko kierroksella jo id (muokkaus) vai ei (uusi) -->
            <h1 th:text="${kierros.id == null} ? 'Uusi kierros' : 'Muokkaa kierrosta'">Kierros</h1>
            <p class="muted" th:text="${onAdmin} ? 'Adminina voit tallentaa kierroksen kenelle tahansa pelaajalle.' : 'Kierros tallennetaan omaan profiiliisi.'"></p>

            <!-- th:object sitoo lomakkeen controllerin Modeliin laittamaan Kierros-olioon -->
            <form class="form" th:action="@{/kierros/tallenna}" th:object="${kierros}" method="post">

                <!-- Yleiset virheet, jotka eivät liity yhteen kenttään (esim. "Valitse pelaaja") -->
                <div class="alert alert--error" th:if="${#fields.hasGlobalErrors()}">
                    <p th:each="virhe : ${#fields.globalErrors()}" th:text="${virhe}"></p>
                </div>

                <!-- Piilokenttä: uudella kierroksella id on tyhjä (INSERT), muokatessa id on olemassa (UPDATE) -->
                <input type="hidden" th:field="*{id}">

                <!-- Pelaajavalinta näytetään vain adminille. Tavallisen käyttäjän kierros liitetään palvelimella hänen omaan pelaajaansa. -->
                <div class="field" th:if="${onAdmin}">
                    <label for="pelaajaId">Pelaaja</label>
                    <select id="pelaajaId" name="pelaajaId">
                        <!-- th:selected valitsee valmiiksi kierroksen nykyisen pelaajan muokatessa -->
                        <option th:each="p : ${pelaajat}" th:value="${p.id}" th:text="${p.nimi}"
                                th:selected="${p.id == valittuPelaajaId}"></option>
                    </select>
                </div>

                <!-- th:field luo kentälle id:n ja name:n (esim. id="pvm"), joten label for="pvm" osuu oikeaan kenttään.
                     th:errorclass lisää luokan is-invalid, jos kentässä on validointivirhe. -->
                <div class="field">
                    <label for="pvm">Päivämäärä</label>
                    <!-- max estää selaimessa tulevat päivät; palvelin tarkistaa saman @PastOrPresent-annotaatiolla -->
                    <input type="date" th:field="*{pvm}" th:errorclass="is-invalid"
                           th:max="${#temporals.format(#temporals.createToday(), 'yyyy-MM-dd')}">
                    <!-- th:errors näyttää kentän validointivirheet (viestit tulevat Kierros-luokan annotaatioista) -->
                    <p class="field-error" th:if="${#fields.hasErrors('pvm')}" th:errors="*{pvm}"></p>
                </div>

                <div class="field">
                    <label for="kentta">Kenttä</label>
                    <input type="text" th:field="*{kentta}" th:errorclass="is-invalid" placeholder="esim. Tali">
                    <p class="field-error" th:if="${#fields.hasErrors('kentta')}" th:errors="*{kentta}"></p>
                </div>

                <div class="field-row">
                    <div class="field">
                        <label for="par">Par</label>
                        <input type="number" th:field="*{par}" th:errorclass="is-invalid" min="54" max="80" placeholder="72">
                        <p class="field-error" th:if="${#fields.hasErrors('par')}" th:errors="*{par}"></p>
                    </div>
                    <div class="field">
                        <label for="lyonnit">Lyönnit</label>
                        <input type="number" th:field="*{lyonnit}" th:errorclass="is-invalid" min="18" max="200">
                        <p class="field-error" th:if="${#fields.hasErrors('lyonnit')}" th:errors="*{lyonnit}"></p>
                    </div>
                </div>

                <div class="form-actions">
                    <a class="btn btn--ghost" th:href="@{/pelaajat}">Peruuta</a>
                    <button type="submit" class="btn btn--primary">Tallenna</button>
                </div>
            </form>
        </div>
    </main>
</body>
</html>
