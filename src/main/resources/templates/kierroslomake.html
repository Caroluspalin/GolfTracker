<!-- MVC-rooli: View. Sama lomake toimii sekä lisäykseen että muokkaukseen. -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Kierros</title>
</head>
<body>
    <h1>Kierros</h1>

    <!-- th:object sitoo lomakkeen controllerin Modeliin laittamaan Kierros-olioon -->
    <form th:action="@{/kierros/tallenna}" th:object="${kierros}" method="post">

        <!-- Piilokenttä: uudella kierroksella id on tyhjä (INSERT), muokatessa id on olemassa (UPDATE) -->
        <input type="hidden" th:field="*{id}">

        <label>Pelaaja:</label>
        <select name="pelaajaId">
            <!-- th:selected valitsee valmiiksi kierroksen nykyisen pelaajan muokatessa -->
            <option th:each="p : ${pelaajat}" th:value="${p.id}" th:text="${p.nimi}"
                    th:selected="${kierros.pelaaja != null and p.id == kierros.pelaaja.id}"></option>
        </select>
        <br>

        <label>Päivämäärä:</label>
        <input type="date" th:field="*{pvm}">
        <br>

        <label>Kenttä:</label>
        <input type="text" th:field="*{kentta}">
        <br>

        <label>Par:</label>
        <input type="number" th:field="*{par}">
        <br>

        <label>Lyönnit:</label>
        <input type="number" th:field="*{lyonnit}">
        <br>

        <button type="submit">Tallenna</button>
    </form>

    <a th:href="@{/pelaajat}">Takaisin</a>
</body>
</html>
