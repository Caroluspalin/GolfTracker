# dev-profiili: paikallinen kehitys H2-muistitietokannalla. Ei vaadi Supabasea eikä salasanoja.
# Tietokanta tyhjenee aina, kun sovellus sammutetaan, ja testidata luodaan käynnistyksessä uudelleen.
spring.datasource.url=jdbc:h2:mem:golftracker
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2-konsoli selaimessa: http://localhost:8080/h2-console (JDBC URL: jdbc:h2:mem:golftracker)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Näyttää Hibernaten SQL-lauseet konsolissa – hyödyllinen oppimisessa ja virheiden etsinnässä.
spring.jpa.show-sql=true

# Luodaanko testikäyttäjät ja -kierrokset käynnistyksessä (ks. GolftrackerApplication.demoData)
golftracker.demo-data=true
