# Yhteiset asetukset kaikille profiileille.
# Profiilikohtaiset asetukset ovat tiedostoissa application-dev.properties (H2) ja application-prod.properties (PostgreSQL).
# Spring lukee ensin tämän tiedoston ja sitten aktiivisen profiilin tiedoston, joka voi ylikirjoittaa arvoja.
spring.application.name=golftracker

# Jos profiilia ei anneta, käytetään dev-profiilia. Näin ./mvnw spring-boot:run ja testit toimivat H2:lla ilman lisäasetuksia.
# Tuotannossa profiili valitaan ympäristömuuttujalla SPRING_PROFILES_ACTIVE=prod.
spring.profiles.default=dev

# Hibernate luo ja päivittää taulut entiteettien perusteella.
spring.jpa.hibernate.ddl-auto=update

# Palvelimen portti. Monet hosting-palvelut kertovat portin PORT-ympäristömuuttujassa; paikallisesti käytetään 8080.
server.port=${PORT:8080}
